server {
    listen 8080;
    listen [::]:8080;

    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Healthcheck - nie powinien przechodzić przez SPA fallback
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite generuje assety z hashami, więc można je długo cache'ować
    location /assets/ {
        try_files $uri =404;

        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Pozostałe statyczne pliki
    location ~* \.(?:ico|css|js|mjs|json|png|jpg|jpeg|gif|svg|webp|woff2?|ttf|map)$ {
        try_files $uri =404;

        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # React SPA / React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Podstawowe security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
