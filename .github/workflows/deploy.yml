name: Deploy to ECS

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag obrazu (np. 2026-10-02_16_45). Puste = latest"
        required: false
        default: "latest"
  workflow_run:
    workflows: ["Build & Push to ECR"]
    types: [completed]

env:
  AWS_REGION: eu-north-1
  ECR_REPOSITORY: one-dev-frontend
  ECS_CLUSTER: one-dev-cluster     
  ECS_SERVICE: one-dev-frontend

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::206135621036:role/one-dev-github-deploy-frontend
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve image
        run: |
          TAG="${{ inputs.image_tag }}"
          [ -z "$TAG" ] && TAG="latest"
          echo "IMAGE=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:$TAG" >> $GITHUB_ENV

      - name: Download current task definition
        run: |
          TD_ARN=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --query 'services[0].taskDefinition' --output text)
          echo "Current task definition: $TD_ARN"
          aws ecs describe-task-definition --task-definition "$TD_ARN" \
            --query taskDefinition > task-def.json

      - name: Set new image in task definition
        run: |
          # zakłada jeden kontener w task definition
          jq --arg img "$IMAGE" '.containerDefinitions[0].image = $img' task-def.json > task-def-new.json
          jq '.containerDefinitions[] | {name, image}' task-def-new.json

      - name: Deploy
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: task-def-new.json
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          force-new-deployment: true
          wait-for-service-stability: true

      - name: Summary
        run: echo "Deployed \`$IMAGE\` to \`$ECS_CLUSTER/$ECS_SERVICE\`" >> $GITHUB_STEP_SUMMARY