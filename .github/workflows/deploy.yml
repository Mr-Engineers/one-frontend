name: Deploy to ECS

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build & Push to ECR"]
    types: [completed]

env:
  AWS_REGION: eu-north-1
  ECS_CLUSTER: one-dev-cluster
  ECS_SERVICE: one-dev-frontend

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::206135621036:role/one-dev-github-deploy-frontend
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      # The task definition (managed by Terraform) uses the :latest image,
      # so a new deployment pulls the most recently pushed image.
      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --force-new-deployment \
            --query 'service.deployments[0].id' --output text
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }}
          echo "Deployed to ECS service \`${{ env.ECS_SERVICE }}\`" >> $GITHUB_STEP_SUMMARY
