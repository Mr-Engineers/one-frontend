name: Build & Push to ECR

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: eu-north-1
  ECR_REPOSITORY: one-dev-frontend
  # Build-time config (VITE_*), managed by Terraform in one-infrastructure
  SSM_PREFIX: /one/dev/frontend

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::206135621036:role/one-dev-github-deploy-frontend
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag (current date)
        run: |
          echo "IMAGE=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}" >> $GITHUB_ENV
          echo "IMAGE_TAG=$(TZ=Europe/Warsaw date +'%Y-%m-%d_%H_%M')" >> $GITHUB_ENV

      # Vite inlines these into the bundle, so they are needed at build time, not in ECS.
      # Parameters still at the Terraform placeholder CHANGE_ME count as not set.
      - name: Read build config from SSM
        run: |
          # VITE_API_BASE_URL is optional (the app defaults to /api), the others are required
          for name in VITE_API_BASE_URL VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY; do
            if value=$(aws ssm get-parameter --name "$SSM_PREFIX/$name" \
                         --query Parameter.Value --output text 2>/tmp/ssm-error); then
              if [ "$value" = "CHANGE_ME" ]; then value=""; fi
            elif grep -q ParameterNotFound /tmp/ssm-error; then
              value=""
            else
              cat /tmp/ssm-error
              exit 1
            fi

            if [ -n "$value" ]; then
              echo "$name=$value" >> "$GITHUB_ENV"
            elif [ "$name" != "VITE_API_BASE_URL" ]; then
              echo "::error::SSM parameter $SSM_PREFIX/$name is not set (the app fails without it)"
              exit 1
            fi
          done

      # --build-arg NAME without a value takes it from the environment; unset ones are skipped
      - name: Build
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL \
            --build-arg VITE_SUPABASE_URL \
            --build-arg VITE_SUPABASE_PUBLISHABLE_KEY \
            -t ${{ env.IMAGE }}:${{ env.IMAGE_TAG }} \
            -t ${{ env.IMAGE }}:latest .

      - name: Push
        run: |
          docker push ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
          docker push ${{ env.IMAGE }}:latest
          echo "Pushed: \`${{ env.IMAGE }}:${{ env.IMAGE_TAG }}\` and \`${{ env.IMAGE }}:latest\`" >> $GITHUB_STEP_SUMMARY
